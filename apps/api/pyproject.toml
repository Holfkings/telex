[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by Black
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",  # raise ... from err in except block
    "E712",  # comparison to True/False (SQLAlchemy column expressions require == True)
    "UP017", # datetime.UTC not supported in Python 3.10
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["ALL"]
"scripts/*" = ["ALL"]
"tests/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["db", "routers", "services", "jobs", "schemas", "config"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "alembic/*",
    "scripts/*",
    "tests/*",
    "worker.py",
    "services/patch_providers/*",
    "services/github_service.py",
    "jobs/handlers/open_pr.py",
    "jobs/handlers/generate_patch.py",
    "jobs/handlers/scan_repo.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "async def lifespan",
    "if _is_production:",
]
